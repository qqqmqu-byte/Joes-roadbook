// ====== MAP INIT ======
// 瓦片源按"中国大陆可达性+稳定性"排序。
// 第1个 curl 测试返回 HTTP/2 200 且 content-type=image/png (256x256 PNG) — 国内稳定
// 天地图需要有效 tk 才能用，空 tk 会返回 418；OSM 在国内被墙
// 加入 ArcGIS 作为可靠备份（支持 CORS，无需 key）
function initMap(){
  const el=document.getElementById('map');
  if(!el) return;
  if(map){ try{map.invalidateSize();}catch(e){}; return; }
  if(typeof L==='undefined'){
    // Leaflet 脚本还在加载中（defer），稍后重试
    if(initMap._retry===undefined) initMap._retry=0;
    if(initMap._retry++<40) setTimeout(initMap,100);
    return;
  }
  // 容器可能尚未布局完，等高度稳定
  if(el.offsetHeight<50){
    if(initMap._retryH===undefined) initMap._retryH=0;
    if(initMap._retryH++<20) setTimeout(initMap,120);
    return;
  }
  initMap._retry=0; initMap._retryH=0;

  map=L.map('map',{center:[39.2,76.5],zoom:6,zoomControl:false,preferCanvas:true});
  const tileSources=[
    // 首选：高德 (无 key，国内最稳，CORS: access-control-allow-origin: *)
    {url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',subdomains:'1234',name:'高德'},
    // 备份1：OSM 标准源（国内多数情况可用）
    {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',subdomains:'abc',name:'OSM'},
    // 备份2：ArcGIS Online（无需 key，CORS 友好，长城内外都可达）
    {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',name:'ArcGIS'},
  ];
  let tileIdx=0,tileLayer=null,errCount=0;
  function tryTile(){
    if(tileIdx>=tileSources.length){
      console.error('[map] 所有瓦片源失败');
      const info=document.getElementById('mapInfo');
      if(info) info.innerHTML='<span class="font-semibold" style="color:var(--terracotta-dark)">地图瓦片加载失败，请检查网络</span>';
      return;
    }
    const src=tileSources[tileIdx];
    const opts={maxZoom:18,attribution:'&copy; '+src.name};
    if(src.subdomains) opts.subdomains=src.subdomains;
    try{
      tileLayer=L.tileLayer(src.url,opts).addTo(map);
    }catch(e){ tileIdx++; errCount=0; return tryTile(); }
    // 累计错误 ≥3 或 5 秒后没成功加载任何瓦片，才切换源（避免一个冷瓦片误判）
    let loadedOk=false;
    tileLayer.on('tileload',()=>{ loadedOk=true; });
    tileLayer.on('tileerror',()=>{
      errCount++;
      if(errCount>=3 && !loadedOk){ tileIdx++; errCount=0; if(tileLayer) map.removeLayer(tileLayer); tryTile(); }
    });
    // 兜底：3 秒内还没成功，立即试下一个源
    setTimeout(()=>{ if(!loadedOk && errCount<3 && tileIdx<tileSources.length){ tileIdx++; errCount=0; if(tileLayer) map.removeLayer(tileLayer); tryTile(); } }, 3000);
  }
  tryTile();
  L.control.zoom({position:'bottomright'}).addTo(map);
  markersLayer=L.layerGroup().addTo(map);
  days.forEach((d,di)=>{const p=dayPois(di);if(p.length>1){dayPolylines[di]=L.polyline(p.map(x=>x.coord),{color:['#a811eb','#0ea5e9','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1'][di],weight:3,opacity:0.7,dashArray:di===2?'10 5':null}).addTo(map);}});
  addMarkers(allPois());fitAll();mapReady=true;
  // 关键：地图 tab 切回或首次显示需要 invalidateSize，否则瓦片不渲染
  setTimeout(()=>{try{map.invalidateSize();}catch(e){};fitAll();},50);
  setTimeout(()=>{try{map.invalidateSize();}catch(e){};},400);
  // 监听 tab 切换，重新计算尺寸
  if(!window._mapResizeBound){
    window._mapResizeBound=true;
    window.addEventListener('resize',()=>{ if(map){ try{map.invalidateSize();}catch(e){}; } });
  }
}
function addMarkers(pois){
  markersLayer.clearLayers();
  pois.forEach(p=>{const m=L.marker(p.coord,{icon:L.divIcon({html:`<div style="background:${themeClr[p.tag]||'#64748b'};border-radius:50%;width:16px;height:16px;box-shadow:0 2px 6px rgba(0,0,0,0.25);border:2px solid #fff"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).addTo(markersLayer);m.bindPopup(`<b>${p.name}</b>${p.day?`<br><span style="color:#D97757;font-weight:600">Day ${p.day} · ${p.time}</span>`:''}<br><span style="color:#64748b;font-size:11px">${(p.desc||'').substring(0,80)}</span><br><a href="https://uri.amap.com/navigation?to=${p.coord[1]},${p.coord[0]},${encodeURIComponent(p.name)}&mode=car&coordinate=wgs84&src=nanjiang" target="_blank" rel="noopener" style="color:#D97757;font-weight:700">🚗 导航 →</a>`);});
}
function fitAll(){const a=allPois();if(a.length)map.fitBounds(a.map(p=>p.coord),{padding:[30,30],maxZoom:10});}

function filterMap(di){
  document.querySelectorAll('#mf button').forEach((b,i)=>{b.className='flex-shrink-0 px-3 py-1.5 rounded-xl text-[11px] font-semibold transition-all active:scale-95 '+(i===di+1||(di===-1&&i===days.length)?'tab-on':'tab-off');});
  if(!mapReady)initMap();
  dayPolylines.forEach(l=>{if(l)l.remove();});
  if(di===-1){days.forEach((d,i)=>{if(dayPolylines[i])dayPolylines[i].addTo(map);});addMarkers(allPois());fitAll();}else{const p=dayPois(di);addMarkers(p.map(x=>({...x,day:di+1})));if(dayPolylines[di])dayPolylines[di].addTo(map);if(p.length)map.fitBounds(p.map(x=>x.coord),{padding:[40,40],maxZoom:13});else map.setView([39.2,76.5],6);}
}

  const akesuList=restaurants.map((r,idx)=>({r,idx})).filter(x=>x.r.city==='阿克苏');
  const akesuGroup=`<div class="glass-heavy p-4 anim-in"><div class="flex items-center gap-2.5 mb-3"><div class="w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0" style="background:var(--brand-gradient)">🍎</div><div><div class="text-sm font-black" style="color:var(--ink)">阿克苏</div><div class="text-[10px]" style="color:var(--slate)">苹果之乡 · 点卡片看详情</div></div></div><div class="rounded-xl p-3 mb-3" style="background:var(--terracotta-light);color:var(--terracotta-deep);line-height:1.7;font-size:11px">💡 ${route}</div><div class="space-y-2">${akesuList.map(({r,idx})=>foodCard(r,idx)).join('')}</div></div>`;

  return `<div class="glass rounded-2xl p-3.5 mb-3 anim-in"><h2 class="text-xs font-bold" style="color:var(--ink)">美食地图</h2><p class="text-[10px] text-slate mt-0.5">喀什 · 库车 · 阿克苏 · 点卡片看详情</p></div>${kashiGroup}${kucheGroup}${akesuGroup}`;
}
function rTips(){
  return `<div class="glass rounded-2xl p-3.5 mb-3 anim-in"><h2 class="text-xs font-bold" style="color:var(--ink)">旅行贴士</h2><p class="text-[10px] text-slate mt-0.5">预订·高反·行车·穿搭</p></div><div class="space-y-2 anim-in">${travelTips.map(t=>`<div class="glass rounded-2xl p-3.5"><div class="text-xs font-bold text-ink mb-2">${t.title}</div><div class="space-y-1">${t.items.map(i=>`<div class="text-[11px] text-slate leading-relaxed flex items-start gap-1.5"><span class="shrink-0 mt-0.5 w-1 h-1 rounded-full bg-brand-400"></span>${i}</div>`).join('')}</div></div>`).join('')}</div><div class="mt-3 flex gap-2 anim-in"><button onclick="openSheet('budget')" class="flex-1 glass rounded-xl py-2.5 text-xs font-bold text-slate-700 active:scale-95">预算估算</button><button onclick="openSheet('gear')" class="flex-1 glass rounded-xl py-2.5 text-xs font-bold text-slate-700 active:scale-95">装备清单</button></div>`;
}

function switchView(i){
  activeView=i;
  for(let j=0;j<4;j++)document.getElementById('btn'+j).className='relative flex-1 flex flex-col items-center gap-1 py-2.5 rounded-xl transition-all active:scale-95 '+(j===i?'tab-on':'tab-off');
  const mc=document.getElementById('mainContent');
  if(i===0)mc.innerHTML=rTrip();
  else if(i===1){
    mc.innerHTML=rMap();
    requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(initMap,0)));
  }
  else if(i===2)mc.innerHTML=rFood();
  else mc.innerHTML=rTips();
  window.scrollTo({top:0,behavior:'smooth'});
  updateFloatToday();
}
function switchTab(i){if(i===activeTab&&activeView===0)return;activeTab=i;if(activeView===0)document.getElementById('mainContent').innerHTML=rTrip();else switchView(0);updateFloatToday();}

function openRestaurant(idx){
  const r=restaurants[idx];
  if(!r)return;
  const dishesHtml=(r.dishes||[]).map(x=>`<div class="flex items-center gap-2.5 py-1.5" style="border-bottom:1px solid var(--sand-light)"><span style="color:var(--terracotta);flex-shrink:0">🍽</span><span style="font-size:12px;color:var(--ink-secondary)">${x}</span></div>`).join('');
  const d=document.createElement('div');
  d.className='fixed inset-0 flex items-end';
  d.style.zIndex='60';
  d.innerHTML=`<div class="absolute inset-0" style="background:rgba(26,26,26,.4);backdrop-filter:blur(3px)" onclick="this.parentElement.remove()"></div><div class="relative w-full bg-white rounded-t-[28px] shadow-2xl overflow-hidden" style="animation:slideUp .3s var(--ease-out) both;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);max-height:82vh;display:flex;flex-direction:column"><div class="flex justify-center pt-3 pb-1"><div class="w-12 h-1.5 rounded-full" style="background:var(--sand)"></div></div><div class="px-5 pt-2 pb-4 overflow-y-auto"><div class="flex items-center justify-between mb-1.5"><h3 style="font-size:18px;font-weight:900;color:var(--ink)">${r.n}</h3><span class="tag t-must">${r.city}</span></div><div style="font-size:11px;color:var(--slate);margin-bottom:2px">📍 ${r.addr||r.loc}</div><div style="font-size:12px;font-weight:700;color:var(--terracotta-dark);margin-bottom:14px">${r.price}</div><div style="font-size:13px;line-height:1.75;color:var(--ink-secondary);margin-bottom:16px">${r.intro||r.desc}</div>${dishesHtml?'<div style="font-size:11px;font-weight:700;color:var(--ink);margin-bottom:8px">特色菜</div>'+dishesHtml:''}<button onclick="this.closest('.fixed').remove()" class="w-full mt-4 py-3 rounded-2xl text-sm font-bold active:scale-95 transition-all" style="background:var(--paper-warm);color:var(--slate)">关闭</button></div></div>`;
  document.body.appendChild(d);
}
function openSheet(type){
  const d=document.createElement('div');d.className='fixed inset-0 z-50 bg-brand-600/40 backdrop-blur-sm';
  let content='';
  if(type==='gear')content=`<h3 class="text-sm font-bold mb-3" style="color:var(--ink)">高原自驾 · 防高反装备清单</h3><div class="space-y-2 text-xs text-slate"><div class="p-3 bg-brand-50/80 rounded-xl"><div class="font-bold mb-0.5" style="color:var(--ink)">防高反</div><p class="text-slate">氧气瓶（喀什买2-3瓶/人）、葡萄糖、布洛芬缓释胶囊。</p></div><div class="p-3 bg-brand-50/80 rounded-xl"><div class="font-bold mb-0.5" style="color:var(--ink)">洋葱穿搭</div><p class="text-slate">三合一冲锋衣、抓绒、保暖手套、防风帽、墨镜、保温杯。</p></div><div class="p-3 bg-brand-50/80 rounded-xl"><div class="font-bold mb-0.5" style="color:var(--ink)">证件</div><p class="text-slate">身份证、边防证（塔县+木吉+红其拉甫）、备用现金。</p></div><div class="p-3 bg-brand-50/80 rounded-xl"><div class="font-bold mb-0.5" style="color:var(--ink)">电子</div><p class="text-slate">充电宝×2、车载充电器、无人机、离线地图。</p></div><div class="p-3 bg-brand-50/80 rounded-xl"><div class="font-bold mb-0.5" style="color:var(--ink)">车载</div><p class="text-slate">防滑链（10月冰川）、备胎检查。塔县务必加满油！</p></div></div>`;
  else{
  const budget=[
    {n:'住宿·喀什希尔顿惠庭·3晚',v:'¥1,142',real:true,note:'9月下旬'},
    {n:'住宿·全季·千草滩·2晚',v:'¥914',real:true,note:'9月下旬 · 双房÷2'},
    {n:'住宿·茗源民宿·1晚',v:'¥380',real:true,note:'9月底'},
    {n:'住宿·温德姆豪生life·1晚',v:'¥278',real:true,note:'10月初'},
    {n:'住宿·阿克苏希尔顿花园·1晚',v:'¥458',real:true,note:'10月初'},
    {n:'住宿·库车希尔顿惠庭·2晚',v:'¥760',real:true,note:'10月初'},
    {n:'机票·武汉→喀什（去程）',v:'¥2,283',real:true,note:'9月下旬 去程·武汉→喀什'},
    {n:'机票·喀什→库车',v:'¥800',real:true,note:'10月初 喀什→库车'},
    {n:'返程·库车→阿克苏→武汉',v:'约¥2,400',real:false,note:'10月初 返程·库车→阿克苏→武汉'},
    {n:'租车·喀什段SUV 5天',v:'¥1,250',real:true,note:'坦克400 · 拼车÷2'},
    {n:'租车·库车段轿车 2天',v:'¥425',real:true,note:'比亚迪元 · 拼车÷2'},
    {n:'燃油+高速',v:'约¥870',real:false,note:'~1,240km'},
    {n:'餐饮美食',v:'约¥1,800',real:false,note:'10天·~¥180/天'},
    {n:'门票+杂费',v:'约¥1,100',real:false,note:'白沙湖/盘龙等'}
  ];
  const knownCount=budget.filter(b=>b.real).length;
  const totalCount=budget.length;
  const knownTotal=budget.reduce((s,b)=>s+(b.real?parseInt(b.v.replace(/[^0-9]/g,'')):0),0);
  const allTotal=budget.reduce((s,b)=>s+parseInt(b.v.replace(/[^0-9]/g,'')),0);
  const ratio=Math.round(knownTotal/allTotal*100);
  content=`<h3 class="text-sm font-bold mb-3" style="color:var(--ink)">费用预算（单人）</h3>
    <div class="glass p-3.5 rounded-xl mb-3" style="background:linear-gradient(135deg,#FFF7F0,#FAE8DC);border:1px solid #F0D5C8">
      <div class="flex items-end justify-between mb-2">
        <div><div style="font-size:10px;font-weight:700;color:var(--terracotta-dark);letter-spacing:.1em">已记实付 · 已记 ${knownCount}/${totalCount} 项</div><div style="font-size:24px;font-weight:900;color:var(--terracotta-deep);letter-spacing:-.02em;line-height:1.1">¥${knownTotal.toLocaleString()}</div></div>
        <div class="text-right"><div style="font-size:10px;color:var(--slate)">含估算总额</div><div style="font-size:14px;font-weight:700;color:var(--ink)">¥${allTotal.toLocaleString()}</div></div>
      </div>
      <div style="height:6px;border-radius:3px;background:var(--sand-light);overflow:hidden"><div style="height:100%;width:${ratio}%;background:var(--brand-gradient);border-radius:3px"></div></div>
      <div style="font-size:9px;color:var(--slate);margin-top:4px;text-align:right">已记 ${ratio}%</div>
    </div>
    <div class="space-y-1 mb-2">${budget.map(b=>`<div class="flex items-center justify-between text-xs py-1.5 border-b" style="border-color:var(--sand-light)"><div class="flex-1 min-w:0"><span style="color:var(--ink)">${b.n}</span><span style="color:var(--slate);font-size:10px;margin-left:6px">${b.note}</span></div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span style="color:'+(b.real?'var(--terracotta-dark)':'var(--ink)')+';font-weight:800;font-size:12px">${b.v}</span>${b.real?'<span style="background:var(--terracotta);color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px">已订</span>':'<span style="background:var(--paper-warm);color:var(--slate);font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px">估</span>'}</div></div>`).join('')}</div>
    <div class="text-[10px] text-slate mt-2 text-center">双人分摊后人均约 ¥${Math.round(allTotal/2).toLocaleString()}</div>`;
}
  d.innerHTML=`<div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-2xl rounded-t-[32px] shadow-2xl max-h-[80vh] flex flex-col" style="animation:slideIn .3s ease-out"><div class="flex justify-center pt-3 pb-2"><div class="w-12 h-1.5 bg-slate-200 rounded-full"></div></div><div class="px-6 pb-10 overflow-y-auto">${content}</div></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d)d.remove();};
}

// ====== SWIPE ======
let tX=0,tY=0;
document.addEventListener('touchstart',e=>{tX=e.touches[0].clientX;tY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY;
  if(Math.abs(dx)<80||Math.abs(dy)>60)return;
  if(e.target.closest('a')||e.target.closest('button')||e.target.closest('.leaflet-container')||e.target.closest('.table-wrap')||e.target.closest('table')||e.target.closest('.no-scroll'))return;
  if(activeView!==0)return;
  if(dx<0&&activeTab<9)switchTab(activeTab+1);else if(dx>0&&activeTab>-2)switchTab(activeTab-1);
},{passive:true});

// ====== INIT ======
function updateHeadPill(){
  const now=new Date();
  const start=new Date('2026-09-25T00:00:00+08:00');
  const end=new Date('2026-10-05T23:59:59+08:00');
  const p=document.getElementById('headPill');
  if(!p)return;
  if(now>=start && now<=end){
    p.textContent='🚗 正在路上';
    p.style.background='var(--brand-gradient)';
    p.style.color='#fff';
    p.style.border='none';
  }else if(now>end){
    p.textContent='已归来';
    p.style.background='var(--paper-warm)';
    p.style.color='var(--slate)';
    p.style.border='1px solid var(--sand)';
  }else{
    const d=Math.max(0,Math.ceil((start-now)/86400000));
    p.textContent='距出发 '+d+' 天';
    p.style.background='var(--terracotta-light)';
    p.style.color='var(--terracotta-deep)';
    p.style.border='1px solid #F0D5C8';
  }
}
updateHeadPill();
switchView(0);
</script>
</body>
</html>
